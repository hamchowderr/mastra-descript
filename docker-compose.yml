# Self-contained agent stack: one Mastra container (server + Studio). Storage and
# vectors run on libSQL (a file: DB on the `libsqldata` volume) — no separate
# storage service. One `docker compose up` brings up a complete, portable agent.
# Deploys as a single Coolify "Docker Compose" resource.
#
# Prefer Postgres + pgvector (Supabase) for storage instead? That's a code-level
# swap plus a compose service — see docs/postgres.md.
#
# Secrets come from .env / Coolify env (never commit them):
#   APP_SECRET, DESCRIPT_API_TOKEN, and the LLM key
#   (AI_GATEWAY_API_KEY, Vercel AI Gateway). See .env.example.

services:
  mastra:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    # Only expose on the internal network — Coolify/Traefik routes the public
    # domain to this service. Do NOT bind a host port here: binding 4111:4111
    # collides ("address already in use") whenever another agent stack is also
    # deployed on the same host, and it bypasses Traefik so FQDN routing and
    # auto-SSL never apply. Local host access is via docker-compose.override.yml.
    #
    # `container_name: mastra` removed for the same reason: container names are
    # global to the Docker host, not namespaced per compose project, so a second
    # stack claiming `mastra` collides even once the ports are correct.
    expose:
      - "4111"
    env_file:
      - .env
    environment:
      - NODE_ENV=production
      # Mastra storage + vectors → libSQL file: DB on the persistent libsqldata
      # volume (absolute path so it lands on the mount, not the ephemeral layer).
      - TURSO_DATABASE_URL=file:/app/data/mastra.db
      # Observability (traces/metrics) DuckDB file → same persistent volume.
      - DUCKDB_PATH=/app/data/mastra.duckdb
    volumes:
      - libsqldata:/app/data # libSQL DB (threads, memory, vectors) + DuckDB (observability)
    deploy:
      resources:
        limits:
          memory: 1G
          cpus: '1.0'
        reservations:
          memory: 256M
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:4111/health"]
      interval: 30s
      timeout: 5s
      start_period: 20s
      retries: 3
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  libsqldata: {}
